apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: shipping
    tier: backend
    component: shipping
data:
  CART_ENDPOINT= "cart:8080"
  DB_HOST= "mysql"
  
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  # these labels are replicaset labels
  labels:
    project: shipping
    tier: backend
    component: shipping
spec:
  replicas: 1
  selector:
    # using these labels replica set selects the pod
    matchLabels:
      project: shipping
      tier: backend
      component: shipping
  # This is pod definition, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: shipping
        tier: backend
        component: shipping
    spec:
      containers:
      - name: shipping
        image: joindevops/shipping:1.4.0
        imagePullPolicy: Always
        # Readiness: Don't send traffic until the port is open
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 20    # Try 20 times before giving up
          periodSeconds: 10       # Check every 10 seconds
    # Liveness: Restart if the port becomes unresponsive
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 20
          failureThreshold: 5
        envFrom:
        - configMapRef:
            name: shipping
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: shipping
    tier: backend
    component: shipping
spec:
  selector:
    # labels are used as selectors
    project: shipping
    tier: backend
    component: shipping
  ports:
  - protocol: TCP
    port: 8080 # servie port
    targetPort: 8080 # container port

