apiVersion: v1
kind: ConfigMap
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: redis
    tier: backend
    component: redis
data:
  MONGO: "true"
  MONGO_URLL: "mongodb://mongodb:27017/redis"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  # these labels are replicaset labels
  labels:
    project: redis
    tier: backend
    component: redis
spec:
  replicas: 1
  selector:
    # using these labels replica set selects the pod
    matchLabels:
      project: redis
      tier: backend
      component: redis
  # This is pod definition, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: redis
        tier: backend
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0
        # Readiness: Don't send traffic until the port is open
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        readinessProbe:
          tcpSocket:
            port: 5679
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
    # Liveness: Restart if the port becomes unresponsive
        livenessProbe:
          httpGet:
            path: /health
            port: 5679
          periodSeconds: 20
          failureThreshold: 5
        envFrom:
        - configMapRef:
            name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: redis
    tier: backend
    component: redis
spec:
  selector:
    # labels are used as selectors
    project: redis
    tier: backend
    component: redis
  ports:
  - protocol: TCP
    port: 5679 # service port
    targetPort: 5679 # container port

