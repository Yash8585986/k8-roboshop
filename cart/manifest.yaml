apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: cart
    tier: backend
    component: cart
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "mongodb://mongodb:27017/cart"
  CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  # these labels are replicaset labels
  labels:
    project: cart
    tier: backend
    component: cart
spec:
  replicas: 1
  selector:
    # using these labels replica set selects the pod
    matchLabels:
      project: cart
      tier: backend
      component: cart
  # This is pod definition, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: cart
        tier: backend
        component: cart
    spec:
      containers:
      - name: cart
        image: joindevops/cart:1.4.0
        imagePullPolicy: Always
        # Readiness: Don't send traffic until the port is open
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
    # Liveness: Restart if the port becomes unresponsive
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 20
          failureThreshold: 5
        envFrom:
        - configMapRef:
            name: cart
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: cart
    tier: backend
    component: cart
spec:
  selector:
    # labels are used as selectors
    project: cart
    tier: backend
    component: cart
  ports:
  - protocol: TCP
    port: 8080 # servie port
    targetPort: 8080 # container port

