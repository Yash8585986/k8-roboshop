apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
  labels:
    project: payment
    tier: backend
    component: payment
data:
  CART_HOST= "cart"
  CART_PORT= "8080"
  USER_HOST= "user"
  USER_PORT= "8080"
  AMQP_HOST= "rabbitmq"
  AMQP_USER= "roboshop"
  AMQP_PASS= "roboshop123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  # these labels are replicaset labels
  labels:
    project: payment
    tier: backend
    component: payment
spec:
  replicas: 1
  selector:
    # using these labels replica set selects the pod
    matchLabels:
      project: payment
      tier: backend
      component: payment
  # This is pod definition, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: payment
        tier: backend
        component: payment
    spec:
      containers:
      - name: payment
        image: joindevops/payment:1.4.0
        imagePullPolicy: Always
        # Readiness: Don't send traffic until the port is open
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
    # Liveness: Restart if the port becomes unresponsive
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 20
          failureThreshold: 5
        envFrom:
        - configMapRef:
            name: payment
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
  labels:
    project: payment
    tier: backend
    component: payment
spec:
  selector:
    # labels are used as selectors
    project: payment
    tier: backend
    component: payment
  ports:
  - protocol: TCP
    port: 8080 # servie port
    targetPort: 8080 # container port

